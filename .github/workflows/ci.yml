name: CI Pipeline

on:
  pull_request:
    branches: [ "main", "develop" ]
  push:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: monew_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. 내 코드 가져오기 (Checkout)
        uses: actions/checkout@v3

      - name: 2. 자바(JDK) 17 설치 및 Gradle 캐시 설정
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      # 공식 Gradle Action 추가
      - name: 2-1. Gradle 캐시 설정
        uses: gradle/actions/setup-gradle@v3

      - name: 3. gradlew에 실행 권한 부여하기
        run: chmod +x gradlew

      - name: 4. 데이터베이스 연결 및 프로젝트 빌드, 커버리지 검사, 배포 산출물 생성하기
        # 테스트 실행 후, 80% 룰(jacocoTestCoverageVerification)까지 검사
        # CD 준비를 위해 bootJar 실행 JAR 생성 여부까지 검증
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/monew_test
          SPRING_DATASOURCE_USERNAME: user
          SPRING_DATASOURCE_PASSWORD: pass
        run: ./gradlew test jacocoTestCoverageVerification bootJar --no-daemon

      - name: 5. Docker 이미지 빌드 검증하기
        run: docker build --tag monew:${{ github.sha }} .

      - name: 6. 배포 산출물(JAR) 업로드하기
        uses: actions/upload-artifact@v4
        with:
          name: monew-boot-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
