spring:
  flyway:
    enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/monew_test}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  batch:
    jdbc:
      initialize-schema: always # 테스트 시 배치 전용 테이블(6개)을 자동으로 생성
    job:
      enabled: false # 테스트 시 서버 구동 시 배치가 자동으로 도는 것을 방지

batch:
  chunk-size: 3
  comment:
    hard-delete:
      batch-size: 10

scheduling:
  enabled: false # 테스트 시 스케줄러 끔

logging:
  level:
    root: info
    org.hibernate.SQL: debug

external-api:
  naver:
    url: https://openapi.naver.com
    client-id: ${NAVER_CLIENT_ID:your_client_id}
    client-secret: ${NAVER_CLIENT_SECRET:your_client_secret}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:test-access-key}
      secret-key: ${AWS_SECRET_ACCESS_KEY:test-secret-key}
    region:
      static: ap-northeast-2

aws:
  s3:
    bucket: ${AWS_S3_BUCKET_NAME:test-bucket}
