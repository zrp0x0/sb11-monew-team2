server:
  port: ${PORT:8080}

spring:
  application:
    name: P1_Monew

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

scheduling:
  enabled: true
  zone: Asia/Seoul
  pool-size: 4
  thread-name-prefix: monew-scheduler-

logging:
  level:
    root: info

external-api:
  hankyung:
    rss-url: ${HANKYUNG_RSS_URL:https://www.hankyung.com/feed/all-news}
