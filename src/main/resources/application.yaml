server:
  port: ${PORT:8080}

spring:
  application:
    name: P1_Monew

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

scheduling:
  enabled: true
  zone: Asia/Seoul
  pool-size: 4
  thread-name-prefix: monew-scheduler-

logging:
  level:
    root: info

monew:
  rss:
    enabled: true
    cron: "0 0 * * * *"
    hankyung:
      url: "https://www.hankyung.com/feed/all-news"