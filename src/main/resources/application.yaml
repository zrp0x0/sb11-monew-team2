spring:
  application:
    name: P1_Monew

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never

scheduling:
  enabled: true
  zone: Asia/Seoul
  pool-size: 4
  thread-name-prefix: monew-scheduler-

batch:
  chunk-size: 1000

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    com.codeit.monew: trace

external-api:
  naver:
    url: https://openapi.naver.com
    client-id: ${NAVER_CLIENT_ID:your_client_id}
    client-secret: ${NAVER_CLIENT_SECRET:your_client_secret}
  hankyung:
    rss-url: ${HANKYUNG_RSS_URL:https://www.hankyung.com/feed/all-news}


cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region:
      static: ap-northeast-2

aws:
  s3:
    bucket: ${AWS_S3_BUCKET_NAME:dummy-bucket}