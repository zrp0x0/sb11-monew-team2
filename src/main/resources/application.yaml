server:
  port: ${PORT:8080}

spring:
  application:
    name: P1_Monew

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: info

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
    region:
      static: ap-northeast-2

aws:
  s3:
    bucket: ${AWS_S3_BUCKET_NAME}